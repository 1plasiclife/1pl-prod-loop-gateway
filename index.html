<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LOOP — 1 Plastic Life (Production)</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root {
      --bg: #0f1c14;
      --card: #1a2e22;
      --text: #f4f7f5;
      --muted: #a8b5ad;
      --accent: #3d8b5e;
      --accent2: #c4a35a;
      --danger: #b85c38;
      --radius: 14px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: var(--font);
      background: radial-gradient(1200px 600px at 80% -10%, #243d2c 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.45;
    }
    main {
      max-width: 420px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--bg);
      background: #7ec8a3;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
    }
    h1 {
      font-size: 1.55rem;
      margin: 14px 0 6px;
      font-weight: 750;
    }
    .sub { color: var(--muted); font-size: 0.95rem; margin: 0 0 22px; }
    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius);
      padding: 14px;
      display: grid;
      gap: 10px;
    }
    .section-label {
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 4px 2px 0;
    }
    a.btn {
      display: block;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      background: var(--accent);
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 650;
      font-size: 1rem;
    }
    a.btn.secondary {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.18);
    }
    a.btn.apply {
      background: var(--accent2);
      color: #1a1408;
    }
    .muted-card {
      border: 1px dashed rgba(255,255,255,0.16);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .muted-card strong { color: var(--text); font-weight: 650; }
    .note {
      margin-top: 18px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .note code { color: #d7e0db; font-size: 0.75rem; }
    .warn {
      margin-top: 12px;
      font-size: 0.78rem;
      color: #e6c7b8;
      border-left: 3px solid var(--danger);
      padding-left: 10px;
    }
    footer {
      margin-top: 28px;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">loop.1plasticlife.org · Production</span>
    <h1>LOOP</h1>
    <p class="sub">1 Plastic Life operations: Production.</p>

    <div class="card">
      <div class="section-label">Staff / ops</div>
      <a class="btn" href="https://script.google.com/macros/s/AKfycbzbHiSf0paceH7Rdgt2Fe05joeS_8nn63sLT7HYFdPkWV88ZIE3BXT2tIFUeE112nJ69Q/exec?view=open" target="_blank" rel="noopener">
        Supervisor dashboard
      </a>
      <a class="btn secondary" href="https://script.google.com/macros/s/AKfycbzbHiSf0paceH7Rdgt2Fe05joeS_8nn63sLT7HYFdPkWV88ZIE3BXT2tIFUeE112nJ69Q/exec?view=workstation_qr" target="_blank" rel="noopener">
        Workstation
      </a>
      <a class="btn secondary" href="https://script.google.com/macros/s/AKfycbzbHiSf0paceH7Rdgt2Fe05joeS_8nn63sLT7HYFdPkWV88ZIE3BXT2tIFUeE112nJ69Q/exec?view=profile" target="_blank" rel="noopener">
        Staff profile
      </a>
      <a class="btn secondary" href="https://script.google.com/macros/s/AKfycbzbHiSf0paceH7Rdgt2Fe05joeS_8nn63sLT7HYFdPkWV88ZIE3BXT2tIFUeE112nJ69Q/exec?view=partner_service" target="_blank" rel="noopener">
        Partner service desk
      </a>

      <div class="section-label">Public apply</div>
      <a class="btn apply" href="https://script.google.com/macros/s/AKfycbzbHiSf0paceH7Rdgt2Fe05joeS_8nn63sLT7HYFdPkWV88ZIE3BXT2tIFUeE112nJ69Q/exec?view=apply" target="_blank" rel="noopener">
        Apply / Partner signup
      </a>

      <a class="btn secondary" href="https://www.1plasticlife.org/business.html" target="_blank" rel="noopener">
        Public site · Business
      </a>
    </div>
    <footer>1 Plastic Life · LOOP</footer>
  </main>
</body>
</html>
